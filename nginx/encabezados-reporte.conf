# Encabezados de la vista del reporte en pantalla (ADR-0111).
#
# Es la página que el monitor muestra en su ventana «Ver reporte», dentro de
# un iframe. Lleva los mismos encabezados que encabezados-seguridad.conf menos
# dos, que pone la API con valores propios de esta página:
# - Content-Security-Policy: el reporte trae su CSS y un script de la propia
#   API (con un nonce distinto en cada respuesta) y solo puede incrustarse en
#   el monitor (frame-ancestors 'self').
# - X-Frame-Options: SAMEORIGIN en lugar de DENY, por la misma razón.
# Si nginx los repitiera, el navegador aplicaría las dos políticas a la vez y
# la de la aplicación bloquearía el estilo y el script del reporte.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
