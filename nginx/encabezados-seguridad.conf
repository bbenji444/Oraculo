# Encabezados de seguridad (especificación, sección 16).
#
# Se incluyen en el server y en cada location que use add_header, porque en
# nginx un add_header dentro de un location anula los heredados del server.

# El navegador no debe adivinar el tipo de un archivo.
add_header X-Content-Type-Options "nosniff" always;
# La aplicación no se puede incrustar en un iframe de otro sitio.
add_header X-Frame-Options "DENY" always;
# Al seguir un link a un medio, no se envía la URL completa del sistema.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# La aplicación no usa cámara, micrófono ni ubicación del navegador.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Solo se cargan recursos del propio sitio. MapLibre v6 carga su worker
# desde un archivo propio, así que worker-src ya no necesita blob: (ADR-0007);
# img-src conserva data: y blob: para las imágenes que arma el mapa.
# La única excepción es God's Eye View (pestaña «God's Eye», 27/10/2026): un
# módulo aparte en el puerto 4173 de esta misma máquina. connect-src deja
# revisar si está corriendo; se abre en su propia pestaña, no aquí dentro.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; worker-src 'self'; connect-src 'self' http://localhost:4173 http://127.0.0.1:4173; style-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
