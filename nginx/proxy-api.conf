# Cómo se reenvía una petición a la API (uvicorn en el puerto 8000).
#
# Lo incluyen los location de /api en monitor-noticias.conf.template, para no
# repetir estas líneas en cada uno. Cada location pone su propio
# proxy_read_timeout.

proxy_pass http://127.0.0.1:8000;
# $http_host conserva el puerto (:8080): la API compara el Origin del
# navegador con este Host para frenar peticiones de otros sitios (CSRF).
proxy_set_header Host $http_host;
# $remote_addr ya es la IP real del analista cuando la petición viene del
# gateway de Oráculo (real_ip en la plantilla). Se manda sola, sin agregarla
# a lo que traiga la petición, para que nadie pueda inventarse otra IP.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Vacíos (y por lo tanto no se reenvían) si la petición no viene del gateway.
proxy_set_header X-Oraculo-User $monitor_oraculo_user;
proxy_set_header X-Oraculo-User-Id $monitor_oraculo_user_id;
proxy_set_header X-Oraculo-Module $monitor_oraculo_module;
