# Configuración del backend de monitor-noticias: dependencias (uv), lint y
# formato (ruff), tipos (mypy) y pruebas (pytest).
#
# Las versiones exactas quedan en uv.lock; aquí solo van los mínimos.
# Las dependencias de fases futuras (trafilatura, google-genai, weasyprint...)
# se agregan en la fase que las usa. F4: rapidfuzz compara títulos para quitar
# duplicados (§9); trafilatura lee el cuerpo de las notas; google-genai llama a
# Gemini (ADR-0015).
#
# HTTP externo (F3): httpx2 + tenacity (ADR-0010); defusedxml lee el RSS de
# Google News sin exponerse a "bombas XML". httpx2 también es el cliente de
# pruebas de FastAPI (Starlette).
#
# Reportes (F7, ADR-0018): jinja2 arma el HTML y weasyprint lo convierte a
# PDF (necesita Pango >= 1.44 del sistema). pypdf, solo en pruebas, lee el
# texto del PDF para comprobar la Ñ y los acentos.

[project]
name = "monitor-noticias-backend"
version = "0.0.0"
description = "API y worker del monitor de noticias geolocalizadas."
readme = "README.md"
# CLAUDE.md §6.1 fija Python 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "celery[redis]>=5.6.3",
    "defusedxml>=0.7.1",
    "fastapi>=0.143.2",
    # google-genai 2.x exige tenacity < 9.2 y el cliente HTTP usa 9.2.1
    # (ADR-0010); la 1.20 es oficial y soporta Gemini 2.5 Flash con JSON.
    "google-genai>=1.20,<2",
    "httpx2>=2.13.1",
    "jinja2>=3.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "rapidfuzz>=3",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "tenacity>=9.2.1",
    "trafilatura>=2",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pypdf>=6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.uv]
# No es una librería para publicar: uv solo administra el entorno.
package = false

# --- ruff ----------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions/*.py.mako"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # orden de imports
  "N",        # nombres PEP 8
  "UP",       # sintaxis moderna de Python
  "B",        # errores probables (bugbear)
  "S",        # seguridad (bandit)
  "A",        # no tapar nombres internos de Python
  "C4",       # comprensiones
  "SIM",      # simplificaciones
  "DTZ",      # fechas sin zona horaria (CLAUDE.md §6.3 exige UTC)
  "T20",      # prohíbe print (CLAUDE.md §6.1)
  "PL",       # pylint
  "RUF",      # reglas propias de ruff
  "D",        # docstrings (CLAUDE.md §5)
]
ignore = [
  "D105",     # métodos mágicos (__repr__, __eq__) no requieren docstring
  "D107",     # el docstring de __init__ va en la clase (estilo Google)
  "RUF001", "RUF002", "RUF003",  # permite ¿, ¡, ñ y acentos en textos en español
]

[tool.ruff.lint.isort]
# La carpeta backend/alembic/ (migraciones) hace creer a ruff que el paquete
# alembic es nuestro; es la librería externa.
known-third-party = ["alembic"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# En pruebas: assert es la herramienta (S101), los valores fijos son datos de
# prueba (S105/S106, PLR2004), cada prueba se explica con su nombre (D1xx) y
# los constructores de datos de prueba aceptan muchos campos opcionales (PLR0913).
"tests/**" = [
  "S101", "S105", "S106", "PLR2004", "PLR0913", "D100", "D101", "D102", "D103", "D104",
]
# Las migraciones de Alembic se generan con una plantilla fija.
"alembic/versions/*" = ["D103"]

# --- mypy ----------------------------------------------------------------------
# CLAUDE.md §6.1: type hints obligatorios en todo; --strict en domain/ y
# application/ (eso lo corre `make lint` con una segunda pasada).

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Celery y kombu no publican tipos; sin esto mypy marca cada import como error.
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# defusedxml tampoco publica tipos (existen en un paquete aparte que no se
# instala). Su resultado se trata como xml.etree.ElementTree.Element, que sí
# tiene tipos, en el adaptador de Google News RSS.
module = ["defusedxml", "defusedxml.*"]
ignore_missing_imports = true

# --- pytest --------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: requiere PostgreSQL y Redis locales (base de pruebas separada)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]
