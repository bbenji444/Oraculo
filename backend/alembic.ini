# Configuración de Alembic (migraciones de esquema, CLAUDE.md §6.3).
#
# La URL de la base NO va aquí: la arma alembic/env.py desde las variables de
# entorno (app.core.config), para no duplicar ni versionar contraseñas.
# Uso: `make migrate` (equivale a `alembic upgrade head`).

[alembic]
script_location = %(here)s/alembic
# Nombre de archivo con fecha para ver en orden cuándo se creó cada migración.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC
truncate_slug_length = 40
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
